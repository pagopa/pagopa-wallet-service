name: OpenAPI Quality Check

# runs when the specs or the check itself change, on any base branch
on:
  pull_request:
    paths:
      - 'api-spec/**/*.yaml'
      - 'api-spec/**/*.yml'
      - '.github/workflows/open_api.yml'

permissions:
  contents: read

jobs:
  openapi_quality:
    runs-on: ubuntu-latest
    name: Lint ${{ matrix.spec.version }}
    strategy:
      fail-fast: false
      matrix:
        spec:
          - path: 'api-spec/wallet-api.yaml'
            version: 'v1'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Report-only: owasp:api2:2023-jwt-best-practices fires at error because bearerAuth's
      # description does not cite RFC 8725. Real finding, left visible rather than silenced;
      # naming RFC 8725 and flipping to fail_severity: error is tracked in PIDM-2366.
      - name: Lint ${{ matrix.spec.path }}
        # note: ruleset bundled with the shared action, can be overridden if needed
        uses: pagopa/github-actions-template/openapi-lint@705d571bb13b279776fd20e9eb20232dc25679e4
        with:
          spec_path: ${{ matrix.spec.path }}
          fail_on_violation: false
